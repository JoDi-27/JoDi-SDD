# Smoke test of bin/jsdd and the hooks on every OS the plugin supports. On
# Windows it runs in Git Bash, as Claude Code does, with core.autocrlf on as
# Git for Windows sets it by default.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Use core.autocrlf like Git for Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4

      - name: Scripts are checked out with LF
        run: |
          if grep -lU $'\r' bin/jsdd hooks/*.sh hooks/hooks.json tests/*.sh; then
            echo "CRLF in the files above: check .gitattributes" >&2; exit 1
          fi

      - name: Tools
        run: |
          command -v jq >/dev/null || { [ "$RUNNER_OS" = Windows ] && choco install -y jq; }
          jq --version
          bash --version | head -1
          python3 --version || python --version

      - name: Smoke test
        run: bash tests/smoke.sh

      - name: Smoke test with bash 3.2 (stock macOS)
        if: runner.os == 'macOS'
        run: PATH="/bin:$PATH" /bin/bash tests/smoke.sh
