# Checks every pull request and push to main: the plugin manifests, shellcheck
# on the scripts, and a smoke test of jsdd and the hooks on Linux, on macOS,
# whose stock bash is 3.2, and on Windows in Git Bash, as Claude Code runs them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/*.json hooks/hooks.json; do jq empty "$f"; done

      - name: Validate the plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.314 plugin validate .

      - name: Shellcheck
        run: shellcheck -S warning bin/jsdd hooks/*.sh .github/scripts/*.sh

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows turns this on by default; .gitattributes must keep the scripts LF.
      - name: Use core.autocrlf like Git for Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4

      - name: Scripts are checked out with LF
        run: |
          if grep -lU $'\r' bin/jsdd hooks/*.sh hooks/hooks.json .github/scripts/*.sh; then
            echo "CRLF in the files above: check .gitattributes" >&2; exit 1
          fi

      - name: Tools
        run: |
          command -v jq >/dev/null || { [ "$RUNNER_OS" = Windows ] && choco install -y jq; }
          jq --version
          python3 --version || python --version

      - name: Smoke test
        # /bin/bash is 3.2 on macOS, the oldest bash jsdd supports; Git Bash on Windows.
        run: |
          if [ "$RUNNER_OS" = Windows ]; then bash .github/scripts/smoke.sh; else /bin/bash .github/scripts/smoke.sh; fi
